name: Takachiho Boat Monitor

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron is UTC. The workflow may be delayed by GitHub.
    # Each run performs several checks locally so monitoring remains frequent.
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check availability repeatedly
        env:
          TARGET_DATE: "2026-08-31"
          TARGET_GUESTS: "2"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "7446942156"
        run: |
          for i in 1 2 3; do
            echo "=== Monitoring pass $i/3 ==="
            python monitor.py
            if [ "$i" -lt 3 ]; then
              echo "Waiting 5 minutes before the next check..."
              sleep 300
            fi
          done

      - name: Save notification state
        run: |
          if [ -f .notified_state ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .notified_state
            git diff --cached --quiet || git commit -m "Record boat availability notification"
            git push
          fi
