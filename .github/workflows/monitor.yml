name: Takachiho Boat Monitor

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron is UTC. Runs every 5 minutes.
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check availability
        env:
          TARGET_DATE: "2026-08-31"
          TARGET_GUESTS: "2"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "7446942156"
        run: python monitor.py

      - name: Save notification state
        run: |
          if [ -f .notified_state ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .notified_state
            git diff --cached --quiet || git commit -m "Record boat availability notification"
            git push
          fi
